{% extends "base.html" %}
{% block title %}Playground · Intent Classifier{% endblock %}
{% block content %}
<h1>Playground</h1>
<p class="muted">Classify a query against one domain and inspect every stage of the retrieval pipeline.</p>

<section class="card">
  <form hx-post="/ui/playground/classify" hx-target="#classify-result" hx-swap="innerHTML"
        hx-indicator="#classify-busy">
    <label>Domain
      <select name="domain" required>
        {% for domain in domains %}
        <option value="{{ domain.id }}" {% if selected == domain.id %}selected{% endif %}>
          {{ domain.name }} ({{ domain.example_count }} examples)
        </option>
        {% else %}
        <option disabled>No domains yet</option>
        {% endfor %}
      </select>
    </label>
    <label>Query
      <textarea name="text" rows="3" required placeholder="Show me all contracts with Microsoft expiring this year"></textarea>
    </label>
    <div class="row">
      <label>Retrieval strategy
        <select name="variant">
          <option value="">assigned automatically</option>
          {% for strategy in strategies %}
          <option value="{{ strategy.name }}">{{ strategy.name }} — {{ strategy.description }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <div class="row">
      <label>Session id <span class="muted small">(same id across turns = one conversation)</span>
        <input name="session_id" value="{{ suggested_session if sessions_enabled else '' }}" maxlength="120"
               pattern="[A-Za-z0-9_.\-:@]+" {% if not sessions_enabled %}disabled placeholder="sessions are disabled"{% endif %}>
      </label>
    </div>
    <label class="inline">
      <input type="checkbox" name="extract_entities" value="1" {% if not extraction_available %}disabled{% endif %}
             {% if extraction_available and extraction_enabled %}checked{% endif %}>
      Extract entities
      {% if not extraction_available %}
        <span class="muted small">(needs a provider: set OPENAI_API_KEY, or LLM_PROVIDER=mock to run offline)</span>
      {% else %}
        <span class="muted small">(provider: {{ provider }}{% if not extraction_enabled %}; off by default, ticking enables it for one request{% endif %})</span>
      {% endif %}
    </label>
    <button type="submit">Classify <span id="classify-busy" class="htmx-indicator">…</span></button>
  </form>
</section>

<div id="classify-result"></div>
{% endblock %}
