[project]
name = "intent-classifier"
version = "0.1.0"
description = "Domain-aware intent classification engine using hybrid dense + sparse retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "chromadb==1.5.2",
    "fastembed==0.8.0",
    "rank-bm25==0.2.2",
    "openai==3.13.0",
    # Observability. The OpenTelemetry packages arrive transitively with
    # chromadb, but this service uses them directly, so they are declared here.
    "prometheus-client==0.24.1",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Documentation prose and HTML templates read worse when hard-wrapped.
"scripts/build_api_docs.py" = ["E501"]
"scripts/build_demo.py" = ["E501"]
"scripts/build_properties.py" = ["E501"]
"scripts/demos/hiring_catalogue.py" = ["E501"]
"scripts/demos/render_hiring_demo.py" = ["E501"]
"scripts/demos/build_hiring_demo.py" = ["E501"]
"scripts/demos/render_hiring_gif.py" = ["E501"]
